<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAMTARIS - AI Agent & Premium Small Business Tools</title>
    
    <style>
        /* ⚡ SPEED & ERROR-FREE CORE STYLES */
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --accent-amber: #f59e0b;
            --accent-emerald: #10b981;
            --accent-red: #ef4444;
            --slate-900: #0f172a;
            --slate-700: #334155;
            --slate-600: #475569;
            --slate-100: #f1f5f9;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; color: var(--slate-900); line-height: 1.5; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        
        /* 🌐 FIXED STICKY HEADER */
        header { position: sticky; top: 0; background: #ffffff; border-b: 1px solid var(--slate-100); z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .nav-container { display: flex; align-items: center; justify-content: space-between; height: 80px; }
        
        .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; font-size: 26px; font-weight: 800; color: var(--primary); letter-spacing: 0.5px; }
        .logo-image { background: linear-gradient(135deg, #3b82f6, #1d4ed8); width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .logo-image svg { width: 22px; height: 22px; fill: white; }
        
        .nav-links { display: flex; gap: 28px; }
        .nav-links a { text-decoration: none; color: var(--slate-600); font-weight: 600; font-size: 15px; transition: color 0.2s; display: flex; align-items: center; gap: 6px; }
        .nav-links a:hover { color: var(--primary); }
        
        .btn-header { background: var(--primary); color: white; padding: 11px 22px; border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 14px; box-shadow: 0 4px 12px rgba(37,99,235,0.2); }
        
        /* 🚀 HERO PRESENTATION LAYOUT */
        .hero-section { padding: 50px 0 70px; }
        .hero { display: flex; flex-direction: column; gap: 40px; align-items: center; }
        
        .hero-left { flex: 1; text-align: center; }
        .badge { display: inline-flex; align-items: center; gap: 6px; background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; padding: 6px 16px; border-radius: 9999px; font-size: 13px; font-weight: 700; margin-bottom: 24px; text-transform: uppercase; }
        .hero-title { font-size: 42px; font-weight: 800; line-height: 1.2; margin-bottom: 22px; color: #1e293b; }
        .hero-title span { background: linear-gradient(to right, #2563eb, #4f46e5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-desc { font-size: 17px; color: var(--slate-600); margin-bottom: 35px; font-weight: 500; }
        .btn-hero { background: var(--slate-900); color: white; padding: 16px 36px; border-radius: 14px; text-decoration: none; font-weight: 700; font-size: 16px; box-shadow: 0 10px 20px rgba(15,23,42,0.15); display: inline-flex; align-items: center; gap: 8px; }
        
        /* RESPONSIVE LAYOUT DISPATCH */
        @media(min-width: 768px) { 
            .hero { flex-direction: row; text-align: left; } 
            .hero-left { text-align: left; }
        }
        
        /* 🤖 INTERACTIVE AI AGENT WORKSPACE PANEL */
        .hero-right { flex: 1; width: 100%; }
        .agent-container { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 24px; box-shadow: 0 20px 30px rgba(0,0,0,0.06); display: flex; flex-direction: column; height: 420px; overflow: hidden; }
        .agent-header { background: linear-gradient(135deg, #1e293b, #0f172a); color: white; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
        .agent-status { display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 8px; height: 8px; background: #34d399; border-radius: 50%; box-shadow: 0 0 8px #34d399; animation: pulse 2s infinite; }
        
        .agent-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #f8fafc; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 16px; font-size: 14px; font-weight: 500; }
        .msg.bot { background: #ffffff; color: var(--slate-900); align-self: flex-start; border: 1px solid #e2e8f0; border-top-left-radius: 4px; }
        .msg.user { background: var(--primary); color: white; align-self: flex-end; border-top-right-radius: 4px; }
        
        /* DYNAMIC INTERACTIVE APP INJECTOR SANDBOX */
        .app-sandbox { background: #eff6ff; border: 2px dashed #bfdbfe; padding: 16px; border-radius: 16px; margin-top: 10px; display: none; flex-direction: column; gap: 10px; }
        .sandbox-title { font-size: 14px; font-weight: 700; color: #1e40af; display: flex; align-items: center; gap: 6px; }
        .sandbox-input { width: 100%; padding: 10px; border: 1px solid #bfdbfe; border-radius: 8px; outline: none; font-size: 13px; margin-bottom: 5px; }
        .sandbox-btn { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; width: 100%; }
        
        .agent-footer { padding: 12px; background: #ffffff; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; }
        .agent-input { flex: 1; padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 12px; outline: none; font-size: 14px; transition: border-color 0.2s; }
        .agent-input:focus { border-color: var(--primary); }
        .agent-send { background: var(--primary); border: none; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; transition: background 0.2s; }
        .agent-send:hover { background: var(--primary-dark); }
        .agent-send svg { width: 18px; height: 18px; fill: currentColor; }
        
        /* 🧰 TOOLS CATALOG GRIDS */
        .catalog { padding: 90px 0; scroll-margin-top: 80px; }
        .cat-header { text-align: center; max-width: 650px; margin: 0 auto 60px; }
        .cat-header h2 { font-size: 34px; font-weight: 800; margin-bottom: 12px; color: #1e293b; }
        .cat-group-title { font-size: 14px; font-weight: 700; text-transform: uppercase; tracking-wider; color: var(--slate-700); margin-bottom: 30px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid var(--slate-100); padding-bottom: 10px; }
        .cat-group-title span { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        
        .tools-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 26px; margin-bottom: 60px; }
        .tool-card { background: white; padding: 28px; border-radius: 22px; border: 1px solid #e2e8f0; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .tool-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05); border-color: var(--primary); }
        .tool-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 18px; }
        .tool-name { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: #1e293b; }
        .tool-desc { font-size: 14px; color: var(--slate-600); line-height: 1.5; }
        
        /* 📝 FOOTER & CONTACT */
        footer { background: white; border-top: 1px solid var(--slate-100); padding: 70px 0 40px; font-size: 14px; color: var(--slate-600); scroll-margin-top: 80px; }
        .footer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 50px; margin-bottom: 50px; }
        .footer-title { font-weight: 700; color: var(--slate-900); font-size: 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        .footer-desc { font-size: 14px; color: #526173; line-height: 1.7; }
        
        .contact-list { list-style: none; }
        .contact-list li { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; font-size: 14px; color: var(--slate-700); font-weight: 500; }
        .contact-list svg { width: 16px; height: 16px; fill: var(--primary); flex-shrink: 0; }
        .contact-list a { color: var(--slate-700); text-decoration: none; }
        .contact-list a:hover { color: var(--primary); }
        
        .footer-bottom { border-top: 1px solid var(--slate-100); padding-top: 30px; display: flex; flex-direction: column; md-flex-direction: row; justify-content: space-between; align-items: center; gap: 20px; font-size: 13px; color: #94a3b8; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>

    <main>
        <section class="container hero-section">
            <div class="hero">
                <div class="hero-left">
